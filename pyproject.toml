[project]
name = "documents-qa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.0",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.11",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "torchvision>=0.29.0",
]

[project.scripts]
documents-qa = "documents_qa:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
